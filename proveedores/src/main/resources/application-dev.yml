spring:
  datasource:
    url: jdbc:h2:mem:proveedoresdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
app:
  cors:
    allowed-origin: ${PROVEEDORES_UI_ORIGIN:http://localhost:5173}
